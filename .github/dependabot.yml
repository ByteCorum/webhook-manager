---
version: 2
updates:
    # GitHub Actions version updates
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
      commit-message:
          prefix: "chore"
          include: "scope"
      labels:
          - "type: maintenance"
          - "size: S"

    # Python version updates
    - package-ecosystem: "pip"
      directory: "/"
      schedule:
          interval: "weekly"
      commit-message:
          prefix: "chore"
          include: "scope"
      labels:
          - "type: maintenance"
          - "size: S"
